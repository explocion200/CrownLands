<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Aurum Keep preview</title><link rel="icon" href="assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="clan-heraldry-v2.css"><link rel="stylesheet" href="docs/visual-qa/stronghold-details/draft.css"><link rel="stylesheet" href="docs/visual-qa/stronghold-details/overview.css">
<script src="functions/clanHeraldryConfig.js" defer></script><script src="functions/clanHeraldryAssets.js" defer></script><script src="functions/clanHeraldryLegacyV1.js" defer></script><script src="functions/clanHeraldryRenderer.js" defer></script><script src="docs/visual-qa/stronghold-details/fixtures.js" defer></script><script src="docs/visual-qa/stronghold-details/preview.js" defer></script></head>
<body><div class="backdrop" aria-hidden="true"></div><button id="reopen" class="reopen">Open Aurum Keep</button>
<dialog id="strongholdDialog" aria-labelledby="strongholdTitle"><div class="holding-shell">
<span class="frame-corner top-left" aria-hidden="true"></span><span class="frame-corner top-right" aria-hidden="true"></span><span class="frame-corner bottom-left" aria-hidden="true"></span><span class="frame-corner bottom-right" aria-hidden="true"></span>
<header class="window-header"><span class="title-seal"><img src="assets/icons/royal-shop-gold-r1.svg" alt=""></span><div class="heading"><p>GOLD STRONGHOLD</p><h1 id="strongholdTitle">Aurum Keep</h1></div><span id="ownership" class="ownership">Under your control</span><button id="close" class="close-button" aria-label="Close Gold Stronghold">×</button></header>
<nav class="tabs-bar" aria-label="Stronghold information"><div role="tablist" aria-label="Aurum Keep information"><button id="overviewTab" role="tab" aria-selected="true" aria-controls="overviewPanel" data-tab="overview">Overview</button><button id="legacyTab" role="tab" aria-selected="false" aria-controls="legacyPanel" tabindex="-1" data-tab="legacy">Stronghold Legacy</button></div><span class="region-note">Aurum Keep · The Core</span></nav>
<section id="overviewPanel" class="overview-panel" role="tabpanel" aria-labelledby="overviewTab"><aside id="identity" class="identity-column" tabindex="0" aria-label="Fortress and ownership"></aside><div id="details" class="details-column" tabindex="0" aria-label="Garrison, benefits and defenses"></div></section>
<section id="legacyPanel" class="legacy-panel" role="tabpanel" aria-labelledby="legacyTab" hidden></section>
<footer id="actions" class="holding-footer"></footer>
</div></dialog>
<dialog id="actionDialog" class="action-dialog" aria-labelledby="actionTitle"><p class="preview-label">DESIGN PREVIEW</p><h2 id="actionTitle"></h2><p id="actionCopy"></p><p class="action-disclosure">This preview does not change the game or send an order.</p><button id="dismissAction" class="primary-button">Back to Aurum Keep</button></dialog>
</body></html>
