<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crownlands · Clan Shop draft</title><link rel="icon" href="../../../assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="../shop-ui/review.css"><script src="review.js" defer></script></head>
<body>
<header class="review-header"><div><p>CROWNLANDS · DESIGN REVIEW</p><h1>Clan Shop · The tower stores</h1></div><span class="draft-badge">Draft only</span></header>
<nav class="review-controls" aria-label="Design preview controls">
 <div class="control-group"><button data-viewport="desktop">Desktop</button><button data-viewport="landscape">Mobile landscape</button><button data-viewport="small">Small landscape</button></div>
 <div class="control-group"><label for="level">Shop level</label><select id="level" aria-label="Shop level"><option value="0">Unbuilt</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option selected>9</option><option>10</option></select></div>
 <div class="control-group"><label for="sample">Example</label><select id="sample"><option value="ready">Ready to buy</option><option value="spent">Allowance used</option><option value="low">Not enough Gold</option><option value="member">Member, not officer</option><option value="new">New clan member</option><option value="upgrading">Upgrade underway</option><option value="paused">Construction paused</option><option value="error">Purchase fails once</option><option value="loading">Loading stock</option><option value="unavailable">Stock unavailable</option></select><button id="reset">Reset preview</button></div>
</nav>
<p class="review-note">Select an item, try a sample purchase, or open Shop upgrades. All seven items use the game's current artwork and Clan Shop allowances. Gold and purchases are samples only.</p>
<main><div id="canvas"><iframe id="preview" title="Clan Shop design preview" src="preview.html"></iframe></div></main>
<footer><span id="dimensions"></span><span id="reviewStatus" role="status">Interactive draft · No account changes</span></footer>
</body></html>
