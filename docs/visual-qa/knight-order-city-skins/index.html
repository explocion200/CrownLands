<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Crown Lands · The Four Orders</title>
  <link rel="stylesheet" href="preview.css">
  <script src="medieval-effects.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
  <main>
    <header class="page-header">
      <div><p class="eyebrow">Crown Lands · City skin concepts</p><h1>The Four Orders</h1></div>
      <span class="preview-label">Animated art preview</span>
    </header>
    <div class="toolbar">
      <div class="view-controls" role="group" aria-label="Preview view">
        <button data-view="inspect" aria-pressed="true">Inspect</button>
        <button data-view="compare" aria-pressed="false">Compare four</button>
        <button data-view="scale" aria-pressed="false">City scale</button>
      </div>
      <div class="motion-controls">
        <label for="effects">Effects</label><select id="effects"><option value="full">Full</option><option value="subtle">Subtle</option><option value="off">Off</option></select>
        <button id="pause" aria-pressed="false">Pause motion</button>
      </div>
    </div>
    <div class="workspace" data-view="inspect">
      <nav id="orders" aria-label="Choose a city skin"></nav>
      <section id="showcase" aria-label="Animated city previews"></section>
    </div>
    <footer>Four visual concepts inspired by medieval military orders. Architecture and effects are artistic interpretations.</footer>
  </main>
</body>
</html>
