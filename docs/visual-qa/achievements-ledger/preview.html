<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Achievements preview</title><link rel="icon" href="assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="docs/visual-qa/achievements-ledger/draft.css"><script src="docs/visual-qa/achievements-ledger/samples.js" defer></script><script src="docs/visual-qa/achievements-ledger/badges.js" defer></script><script src="docs/visual-qa/achievements-ledger/preview.js" defer></script></head>
<body><div class="backdrop" aria-hidden="true"></div>
<dialog id="achievementDialog" aria-labelledby="achievementTitle"><div class="achievement-shell">
<header class="achievement-header"><img class="header-seal" src="assets/icons/reward-achievements-r1.svg" alt=""><div class="heading-copy"><p>Deeds worthy of the Crown</p><h1 id="achievementTitle">Achievements</h1></div><div class="season-clock"><span>Season ends in</span><strong id="seasonClock">17d 12h</strong><small>01 Oct · 00:00 UTC</small></div><nav class="reward-tabs" aria-label="Reward panels"><button data-tab="daily" aria-label="Daily Login" title="Daily Login"><img src="assets/icons/reward-daily-login-r1.svg" alt=""></button><button data-tab="quests" aria-label="Daily Quests" title="Daily Quests"><img src="assets/icons/reward-daily-quests-r1.svg" alt=""></button><button data-tab="achievements" aria-label="Achievements" aria-current="page" title="Achievements"><img src="assets/icons/reward-achievements-r1.svg" alt=""></button></nav><button id="closeAchievement" class="close" aria-label="Close Achievements">×</button></header>
<section class="season-summary" aria-label="Season progress"><div class="season-title"><span>MONTHLY CAMPAIGN</span><strong>September 2026</strong></div><div class="season-track"><div><span>Season progress</span><strong id="completedCount"></strong></div><span class="progress-track"><i id="seasonProgress"></i></span></div><div class="collected-total"><strong id="claimedCount"></strong><span>rewards collected</span></div><span id="readyCount" class="ready-count"></span></section>
<div class="filters"><nav id="categories" aria-label="Achievement categories"></nav><label class="mobile-category">Category<select id="categorySelect" aria-label="Achievement category"></select></label><label class="status-filter">Show<select id="statusSelect" aria-label="Achievement status"><option value="all">All states</option><option value="ready">Ready to claim</option><option value="progress">Underway</option><option value="claimed">Collected</option></select></label></div>
<div class="achievement-body"><section class="ledger" aria-label="Achievement ledger"><div class="ledger-heading"><span id="listTitle">All achievements</span><small id="listCount"></small></div><div id="achievementList" tabindex="0" aria-label="Select an achievement"></div><p class="ledger-note">Progress and unclaimed rewards reset each season.</p></section><section class="detail" aria-label="Selected achievement"><div class="detail-heading"><span id="detailNumber"></span><span id="detailState"></span></div><div id="detailScroll" class="detail-scroll"></div><footer id="actionFooter" class="action-footer"></footer></section></div>
</div></dialog>
<section id="dismissed" hidden><p>Achievements preview closed.</p><button id="reopen" class="primary">Reopen Achievements</button></section><p id="liveStatus" class="sr-only" role="status"></p>
</body></html>
