<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Quests preview</title><link rel="icon" href="assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="docs/visual-qa/quests-ledger/draft.css"><script src="docs/visual-qa/quests-ledger/samples.js" defer></script><script src="docs/visual-qa/quests-ledger/icons.js" defer></script><script src="docs/visual-qa/quests-ledger/preview.js" defer></script></head>
<body><div class="backdrop" aria-hidden="true"></div>
<dialog id="questDialog" aria-labelledby="questTitle"><div class="quest-shell">
  <header class="quest-header"><span class="header-seal" data-icon="ledger" aria-hidden="true"></span><div class="heading-copy"><p>In service of your realm</p><h1 id="questTitle">Quests</h1></div><div class="reset-clock"><span>New quests in</span><strong id="countdown">08:42:16</strong><small>00:00 UTC</small></div><nav class="reward-tabs" aria-label="Reward panels"><button data-tab="daily" aria-label="Daily Login" title="Daily Login"><img src="assets/icons/reward-daily-login-r1.svg" alt=""></button><button data-tab="quests" aria-label="Daily Quests" aria-current="page" title="Daily Quests"><img src="assets/icons/reward-daily-quests-r1.svg" alt=""></button><button data-tab="achievements" aria-label="Achievements" title="Achievements"><img src="assets/icons/reward-achievements-r1.svg" alt=""></button></nav><button id="closeQuest" class="close" aria-label="Close Quests">×</button></header>
  <div class="quest-body"><section class="ledger" aria-label="Daily quest ledger"><div class="ledger-heading"><div><h2>Today's duties</h2><p>Three deeds for the Crown.</p></div><span id="completionCount"></span></div><div id="questList" aria-label="Select a quest"></div><section id="chestMilestone" class="chest-milestone" aria-label="Daily chest milestone"></section></section>
  <section class="detail" aria-label="Selected quest"><div class="detail-heading"><span id="detailNumber"></span><span id="detailState"></span></div><div id="detailScroll" class="detail-scroll"></div><footer id="actionFooter" class="action-footer"></footer></section></div>
</div></dialog>
<dialog id="replaceDialog" aria-labelledby="replaceTitle"><div class="confirmation"><span class="confirmation-icon" data-icon="ledger" aria-hidden="true"></span><p class="eyebrow">One daily replacement</p><h2 id="replaceTitle">Replace this quest?</h2><p id="replaceText"></p><p class="replace-note">Its current progress will be lost. Your other two quests stay as they are.</p><div><button id="keepQuest" class="secondary">Keep quest</button><button id="confirmReplace" class="primary">Replace quest</button></div></div></dialog>
<section id="dismissed" hidden><p>Quests preview closed.</p><button id="reopen" class="primary">Reopen Quests</button></section><p id="liveStatus" class="sr-only" role="status"></p>
</body></html>
