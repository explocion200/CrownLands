<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../">
  <title>Incoming Threats preview</title>
  <link rel="icon" href="assets/icons/crownlands-favicon-32.png">
  <link rel="stylesheet" href="docs/visual-qa/incoming-threats/draft.css">
  <script src="docs/visual-qa/incoming-threats/preview.js" defer></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <button id="reopen" class="reopen">Open Incoming Threats</button>
  <dialog id="threatDialog" aria-labelledby="threatTitle">
    <div class="ledger">
      <header class="window-header">
        <svg class="heading-art" aria-hidden="true"><use href="assets/icons/battle-reports-ledger-r1.svg#defense-defeat"></use></svg>
        <div class="heading"><p>THE WATCHMAN'S LEDGER</p><h1 id="threatTitle">Incoming Threats</h1></div>
        <span class="header-note">Keep watch over your cities</span>
        <button id="close" class="close-button" type="button" aria-label="Close Incoming Threats">×</button>
      </header>
      <section id="summary" class="summary" aria-label="Incoming threat summary"></section>
      <nav class="filters" aria-label="Filter incoming threats">
        <button data-filter="all" aria-pressed="true">All <span id="allCount">0</span></button>
        <button data-filter="attack" aria-pressed="false"><svg aria-hidden="true"><use href="assets/icons/battle-reports-ledger-r1.svg#attack"></use></svg>Attacks <span id="attackCount">0</span></button>
        <button data-filter="scout" aria-pressed="false"><svg aria-hidden="true"><use href="assets/icons/battle-reports-ledger-r1.svg#scout"></use></svg>Scouts <span id="scoutCount">0</span></button>
        <span class="sort-note">Soonest arrival first</span>
      </nav>
      <div class="column-labels" aria-hidden="true"><span>Arrival</span><span>Attacker &amp; origin</span><span>Your city</span><span>Incoming force</span><span>Location</span></div>
      <main id="threatList" class="threat-list" tabindex="0" aria-label="Incoming attacks and scouts"></main>
      <footer class="ledger-footer"><span id="panelStatus" role="status">Keeping watch across your kingdom</span><span id="visibleCount"></span></footer>
    </div>
  </dialog>
</body>
</html>
