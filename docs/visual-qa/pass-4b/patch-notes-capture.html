<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pass 4B Patch Notes Capture</title>
  <style>
    html, body, iframe { width:100%; height:100%; margin:0; border:0; overflow:hidden; background:#17110d; }
  </style>
</head>
<body>
  <iframe id="game" src="../../../index.html" title="Crownlands signed-out entry"></iframe>
  <script>
    const frame = document.querySelector("#game");
    frame.addEventListener("load", () => {
      const openPatchNotes = () => {
        const button = frame.contentDocument?.querySelector("#patchNotesBtn");
        if (button) button.click();
        else window.setTimeout(openPatchNotes, 250);
      };
      window.setTimeout(openPatchNotes, 800);
    });
  </script>
</body>
</html>
