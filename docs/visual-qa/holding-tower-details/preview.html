<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Clan Tower preview</title><link rel="icon" href="assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="clan-heraldry-v2.css"><link rel="stylesheet" href="docs/visual-qa/holding-tower-details/draft.css"><script src="functions/clanHeraldryConfig.js" defer></script><script src="functions/clanHeraldryAssets.js" defer></script><script src="functions/clanHeraldryLegacyV1.js" defer></script><script src="functions/clanHeraldryRenderer.js" defer></script><script src="functions/playerFlagConfig.js" defer></script><script src="functions/flagRenderer.js" defer></script><script src="docs/visual-qa/holding-tower-details/fixtures.js" defer></script><script src="docs/visual-qa/holding-tower-details/preview.js" defer></script></head><body>
<button id="reopen" class="primary-button reopen">Open Clan Tower</button>
<dialog id="towerDialog" aria-labelledby="towerTitle"><div class="tower-shell">
<header class="window-header"><img src="assets/icons/skills/stoneworks.svg" alt=""><div class="heading"><p>CLAN TOWER</p><h1 id="towerTitle">Ravenwatch Tower</h1></div><span id="ownership" class="ownership">Your clan</span><button id="close" class="close-button" aria-label="Close Clan Tower">×</button></header>
<nav class="tabs-bar" aria-label="Tower information"><div role="tablist" aria-label="Clan Tower information"><button id="overviewTab" role="tab" aria-selected="true" aria-controls="overviewPanel" data-tab="overview">Overview</button><button id="garrisonTab" role="tab" aria-selected="false" aria-controls="garrisonPanel" tabindex="-1" data-tab="garrison">Garrison</button><button id="wallsTab" role="tab" aria-selected="false" aria-controls="wallsPanel" tabindex="-1" data-tab="walls">Walls &amp; Veil</button><button id="rulesTab" role="tab" aria-selected="false" aria-controls="rulesPanel" tabindex="-1" data-tab="rules">Tower Rules</button></div><span id="quadrant" class="map-name"></span></nav>
<section id="overviewPanel" role="tabpanel" aria-labelledby="overviewTab" class="overview-panel"><aside id="identity" class="identity-column" tabindex="0" aria-label="Tower artwork and clan"></aside><div id="overview" class="detail-column" tabindex="0" aria-label="Tower defenses and orders"></div></section>
<section id="garrisonPanel" role="tabpanel" aria-labelledby="garrisonTab" class="scroll-panel" tabindex="0" hidden></section>
<section id="wallsPanel" role="tabpanel" aria-labelledby="wallsTab" class="scroll-panel" tabindex="0" hidden></section>
<section id="rulesPanel" role="tabpanel" aria-labelledby="rulesTab" class="scroll-panel" tabindex="0" hidden></section>
<footer class="tower-footer"><div><strong id="footerTitle"></strong><span id="footerHint"></span></div><button id="primaryAction" class="primary-button" data-action="reinforce">Reinforce</button><button id="moveAction" class="primary-button" data-action="withdraw"><img src="assets/icons/troop-orders/marching-banner.svg" alt="">Move</button><button id="back" class="paper-button">Back to Map</button></footer>
</div></dialog>
<dialog id="towerOrderDialog" aria-label="Your Clan Tower troop order"><iframe id="personalOrderFrame" title="Personal attack or move order"></iframe></dialog><dialog id="actionDialog" class="action-dialog" aria-labelledby="actionTitle"><p class="eyebrow">DESIGN PREVIEW</p><h2 id="actionTitle"></h2><p id="actionCopy"></p><p class="muted">This preview does not send troops, spend gold or change the game.</p><button id="dismiss" class="primary-button">Back to Tower</button></dialog>
</body></html>
