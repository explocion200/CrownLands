<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Realm Atlas preview</title><link rel="icon" href="assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="docs/visual-qa/map-selector-atlas/draft.css"><script src="assets/worlds/core-expansion-v1/region-catalog.js" defer></script><script src="docs/visual-qa/map-selector-atlas/snapshot.js" defer></script><script src="docs/visual-qa/map-selector-atlas/frames.js" defer></script><script src="docs/visual-qa/map-selector-atlas/preview.js" defer></script></head><body><div class="backdrop" aria-hidden="true"></div><button id="reopen" class="reopen">Open Map Selector</button>
<dialog id="atlasDialog" aria-labelledby="atlasTitle"><div class="atlas-shell"><header class="window-header"><img class="heading-art" src="assets/map-icon.png" alt=""><div class="heading"><p>THE REALM ATLAS</p><h1 id="atlasTitle">Map Selector</h1></div><div class="map-legend" aria-label="Map feature indicators"><span class="legend-tower">Tower</span><span class="legend-camp">Camp</span><span class="legend-royal">Stronghold / Citadel</span></div><button id="close" class="close-button" aria-label="Close Map Selector">×</button></header>
<nav class="atlas-toolbar" aria-label="Map navigation"><button id="current" class="location-shortcut current"><span class="location-mark" aria-hidden="true">◆</span><span><small>Current map</small><strong id="currentName"></strong></span></button><button id="home" class="location-shortcut home"><span class="location-mark" aria-hidden="true">⌂</span><span><small>Home map</small><strong id="homeName"></strong></span></button><button id="fit" class="fit-button">Whole realm</button><div class="zoom-controls" aria-label="Zoom controls"><button id="zoomOut" aria-label="Zoom out">−</button><output id="zoomValue" aria-live="off">80%</output><button id="zoomIn" aria-label="Zoom in">+</button></div></nav>
<main id="mapViewport" class="map-viewport" tabindex="0" aria-label="Realm map. Drag to pan; scroll or use zoom buttons. Arrow keys move between focused maps."><div id="mapStage" class="map-stage"><svg id="connections" class="connections" aria-hidden="true"></svg><div id="tiles"></div></div><div class="compass" aria-hidden="true"><span>N</span><svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="29"/><circle cx="45" cy="45" r="34"/><path d="M45 3 51 39 87 45 51 51 45 87 39 51 3 45 39 39Z"/><path d="m45 11 0 34 7-6Zm0 68 0-34-7 6ZM11 45h34l-6-7Zm68 0H45l6 7Z" class="filled"/></svg></div><span class="pan-hint">Drag the chart to explore</span></main>
<footer class="atlas-footer"><span id="mapInfo" role="status">Choose a map to open it.</span><span id="mapCount"></span></footer></div><div id="notice" class="notice" role="status" hidden></div></dialog>
<section id="mapVisit" class="map-visit" hidden><div class="visit-card"><p>MAP PREVIEW</p><div id="visitArt" class="visit-art"></div><h2 id="visitName"></h2><p id="visitInfo"></p><p class="preview-disclosure">In the game, selecting this tile opens its map.</p><button id="returnToAtlas">Return to Map Selector</button></div></section></body></html>
