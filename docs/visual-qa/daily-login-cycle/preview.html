<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Daily Login preview</title><link rel="icon" href="assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="docs/visual-qa/daily-login-cycle/draft.css"><script src="docs/visual-qa/daily-login-cycle/cycle-model.js" defer></script><script src="docs/visual-qa/daily-login-cycle/preview.js" defer></script></head>
<body><div class="backdrop" aria-hidden="true"></div><dialog id="dailyDialog" aria-labelledby="dailyTitle"><div class="daily-shell">
<header class="daily-header"><span id="headerSeal" class="header-seal" aria-hidden="true"></span><div><p>A gift for your return</p><h1 id="dailyTitle">Daily Login</h1></div><div class="cycle-status"><span id="cycleLabel"></span><strong id="dayLabel"></strong></div><button id="closeDaily" class="close" aria-label="Close Daily Login">×</button></header>
<div class="daily-body"><section class="reward-ledger" aria-label="28-day reward cycle"><div class="ledger-heading"><div><h2>Your royal rewards</h2><p>Four weeks. Yours to finish.</p></div><span id="progressLabel"></span></div><nav id="weekNav" aria-label="Reward weeks"></nav><div id="weeks"></div><footer class="ledger-footer"><span><i class="legend-ready"></i> Ready</span><span><i class="legend-claimed"></i> Collected</span><span class="carry-note">Progress carries across seasons</span></footer></section><section class="reward-detail" aria-label="Selected reward"><div class="detail-heading"><span id="selectedDayLabel"></span><span id="selectedStatus"></span></div><div id="detailScroll" class="detail-scroll"></div><footer class="claim-footer"><p id="claimNote"></p><button id="claimButton" class="claim-button"></button></footer></section></div>
</div></dialog><section id="dismissed" hidden><p>Daily Login preview closed.</p><button id="reopen">Reopen Daily Login</button></section><p id="liveStatus" class="sr-only" role="status"></p></body></html>
