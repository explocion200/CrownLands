<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle menu sample — not the live game</title>
  <link rel="stylesheet" href="/action-buttons.css">
  <link rel="stylesheet" href="draft.css">
  <script src="draft.js" defer></script>
</head>
<body>
  <main id="scene" aria-label="Fictional castle action menu preview">
    <div id="backdrop" aria-hidden="true"></div>
    <div id="neighbors" aria-hidden="true"></div>
    <div class="draft-label"><b>Castle actions</b><span>Approved layout · sample city</span></div>
    <div id="selection">
      <div id="banner"><span>[SAMPLE] YOUR KINGDOM</span><strong>STONEWARD</strong><b id="level">100</b></div>
      <button id="castle" aria-label="Select sample castle"><img alt="Sample city" draggable="false"></button>
      <svg id="arc" aria-hidden="true"><path class="arc-shadow"></path><path class="arc-line"></path></svg>
      <div id="actions" role="group" aria-label="Sample castle actions"></div>
    </div>
    <div id="legend">Sample city · no commands are sent</div>
    <output id="feedback" role="status" aria-live="polite"></output>
  </main>
</body></html>
