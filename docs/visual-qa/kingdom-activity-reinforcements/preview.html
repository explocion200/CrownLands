<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Kingdom Activity Reinforcements preview</title><link rel="icon" href="assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="docs/visual-qa/kingdom-activity-reinforcements/draft.css"><script src="docs/visual-qa/kingdom-activity-reinforcements/preview.js" defer></script></head>
<body><div class="backdrop" aria-hidden="true"></div><button id="reopen" class="reopen">Open Kingdom Activity</button>
<dialog id="reportDialog" aria-labelledby="reportTitle"><div class="report-shell">
  <header class="window-header"><img class="heading-art" src="assets/icons/skills/marchOrders.svg" alt=""><div class="heading"><p>ORDERS OF THE REALM</p><h1 id="reportTitle">Kingdom Activity</h1></div><div class="support-heading"><img src="assets/icons/skills/shieldwallDiscipline.svg" alt=""><span>Clan support</span></div><button id="close" class="close-button" aria-label="Close Kingdom Activity">×</button></header>
  <nav class="activity-tabs" aria-label="Kingdom activity categories"><button disabled>Marches <span>4</span></button><button disabled>Rallies <span>2</span></button><button aria-current="page">Reinforcements <span id="supportCount">7</span></button><button disabled>Camps <span>1</span></button><button disabled>Strongholds <span>2</span></button></nav>
  <nav id="sectionNav" class="support-nav" aria-label="Reinforcement sections"><div class="support-total"><strong id="assignmentCount">7</strong><span>support assignments</span></div><button data-jump="traveling"><span>Traveling</span><b>3</b></button><button data-jump="allies"><span>Stationed with allies</span><b>2</b></button><button data-jump="defending"><span>Defending your holdings</span><b>2</b></button></nav>
  <main id="supportLedger" class="support-ledger" tabindex="0" aria-label="All reinforcement assignments"></main>
  <footer class="report-footer"><span id="panelStatus" role="status">Stationed troops remain until returned, invalidated or lost in battle.</span><span>Scroll for all support</span></footer>
</div></dialog>
<dialog id="returnConfirmation" aria-labelledby="confirmationTitle" aria-describedby="confirmationMessage"><form method="dialog"><h2 id="confirmationTitle">Return troops</h2><p id="confirmationMessage"></p><div class="confirmation-actions"><button value="cancel" autofocus>Cancel</button><button id="confirmReturn" value="confirm">Confirm return</button></div></form></dialog>
<p id="liveStatus" class="sr-only" role="status"></p></body></html>
