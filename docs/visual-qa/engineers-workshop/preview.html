<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Engineers’ Workshop preview</title><link rel="icon" href="assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="docs/visual-qa/engineers-workshop/draft.css"><script src="clan-tower-buildings.js" defer></script><script src="docs/visual-qa/engineers-workshop/preview.js" defer></script></head>
<body><div class="world-backdrop" aria-hidden="true"></div>
<dialog id="workshopDialog" aria-labelledby="workshopTitle"><div class="workshop-shell">
 <header class="window-header"><img class="header-emblem" src="assets/icons/skills/stoneworks.svg" alt=""><div class="heading"><p>Ravenwatch · Clan Tower</p><h1 id="workshopTitle">Engineers’ Workshop</h1></div><div class="treasury"><span>Clan Treasury</span><strong><img src="assets/icons/royal-shop-gold-r1.svg" alt="Gold"><span id="balance"></span></strong></div><button id="closeWorkshop" class="close" aria-label="Close Engineers’ Workshop">×</button></header>
 <div class="workshop-body">
  <aside class="building-panel" tabindex="0" aria-label="Workshop building and level"><p class="overline">The Amber Wardens</p><div class="building-art"><img id="buildingArt" src="assets/clan-buildings/workshop-2.webp" alt="Engineers’ Workshop building"></div><h2 id="buildingLevel"></h2><div id="levelTrack" class="level-track"></div><p id="buildingCaption" class="building-caption"></p><div class="building-seal" aria-hidden="true">◆</div><p class="building-note">Completed benefits stay active during construction, attacks and repairs.</p></aside>
  <section class="detail-panel" aria-label="Workshop improvements">
   <nav class="workshop-tabs" aria-label="Workshop sections"><div role="tablist"><button id="tab-overview" type="button" role="tab" aria-controls="overviewPanel" aria-selected="true" data-section="overview">Overview</button><button id="tab-levels" type="button" role="tab" aria-controls="levelsPanel" aria-selected="false" data-section="levels">All levels</button></div><span class="local-scope">This Clan Tower</span></nav>
   <div id="overviewPanel" class="detail-scroll" tabindex="0" role="tabpanel" aria-labelledby="tab-overview"></div>
   <div id="levelsPanel" class="detail-scroll" tabindex="0" role="tabpanel" aria-labelledby="tab-levels" hidden></div>
  </section>
 </div>
 <footer class="upgrade-footer"><dl id="upgradeFacts"></dl><button id="upgrade" class="primary" type="button" aria-describedby="upgradeNote"></button><p id="upgradeNote" role="status"></p></footer>
</div></dialog>
<div id="dismissed" hidden><p>Workshop preview closed.</p><button id="reopen" class="primary">Reopen Workshop</button></div>
<p id="liveStatus" class="sr-only" role="status" aria-live="polite"></p>
</body></html>
