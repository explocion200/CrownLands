<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Crownlands Estate — Visual Draft</title><link rel="stylesheet" href="inner-city-estate.css?v=20261007-estate-resources-r1"><style>body{margin:0;background:#79864a}#closeModalBtn{position:absolute;right:8px;top:8px;z-index:30}#fixtureControls{position:absolute;right:12px;bottom:12px;z-index:15;display:flex;gap:5px;padding:4px;background:#f0e4c7;border:1px solid #ad9870}#fixtureControls select{min-height:44px;max-width:125px;background:#f0e4c7;color:#332e23;border:1px solid #ad9870}#previewGear{display:grid;place-items:center;min-height:44px;margin:0 6px;font-size:12px;color:#332e23} @media(max-height:550px){#fixtureControls{right:7px;bottom:7px}#fixtureControls select{max-width:100px}}</style></head>
<body><dialog id="modal" class="bailey-modal" aria-labelledby="modalTitle"><article class="modal-card"><button id="closeModalBtn" type="button" aria-label="Close preview">×</button><h2 id="modalTitle">Crownlands — Inner Castle</h2><div id="modalBody"></div></article></dialog><script src="inner-city-estate.js?v=20261007-estate-resources-r1"></script><script>
  const dialog=document.querySelector('#modal'),host=document.querySelector('#modalBody'),params=new URL(location.href).searchParams;
  let view;
  const scene=params.get('scene')||'initial';
  const fixture=scene==='initial'?null:Object.fromEntries(CrownlandsEstate.buildings.map(b=>[b.key,scene==='completed'?'completed':'constructing']));
  const levels=params.get('levels')==='milestones'?Object.fromEntries(CrownlandsEstate.buildings.map((b,i)=>[b.key,[1,25,50,75,100][i%5]])):null;
  const resources={gold:2500000,crowns:160,timber:1250,stone:840,ore:420,grain:9800,planks:750,iron:210,tools:48,food:3200};
  view=CrownlandsEstate.mount(host,{cityName:'Crownlands',fixture,levels,resources,resourcePreview:true,onBack:()=>{dialog.close();}});
  const controls=document.createElement('div');controls.id='fixtureControls';controls.innerHTML='<select aria-label="Visual fixture"><option value="initial">Initial estate</option><option value="completed">All completed</option><option value="constructing">Construction</option></select><a id="previewGear">Building UIs</a>';
  const uiUrl=new URL(location.href);uiUrl.searchParams.set('estateUi','1');controls.children[1].href=uiUrl.href;controls.children[1].hidden=location.hostname!=='127.0.0.1';
  host.querySelector('.estate-viewport').append(controls);controls.children[0].value=scene;
  controls.children[0].onchange=event=>{params.set('scene',event.target.value);params.delete('motion');location.search=params.toString()};
  document.querySelector('#closeModalBtn').onclick=()=>{view.destroy();dialog.close();};dialog.addEventListener('close',()=>view.destroy());dialog.showModal();
  window.estatePreview=view;
</script></body></html>
