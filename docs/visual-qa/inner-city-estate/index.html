<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Crownlands Estate — Visual Draft</title><link rel="stylesheet" href="inner-city-estate.css"><style>body{margin:0;background:#79864a}#closeModalBtn{position:absolute;right:8px;top:8px;z-index:30}#fixtureControls{position:absolute;right:12px;bottom:12px;z-index:15;display:flex;gap:5px;padding:4px;background:#f0e4c7;border:1px solid #ad9870}#fixtureControls select{min-height:44px;max-width:125px;background:#f0e4c7;color:#332e23;border:1px solid #ad9870}#previewGear{margin:6px;font-size:12px} @media(max-height:550px){#fixtureControls{right:7px;bottom:7px}#fixtureControls select{max-width:100px}}</style></head>
<body><dialog id="modal" class="bailey-modal" aria-labelledby="modalTitle"><article class="modal-card"><button id="closeModalBtn" type="button" aria-label="Close preview">×</button><h2 id="modalTitle">Crownlands — Inner Castle</h2><div id="modalBody"></div></article></dialog><script src="inner-city-estate.js"></script><script>
  const dialog=document.querySelector('#modal'),host=document.querySelector('#modalBody'),params=new URL(location.href).searchParams;
  let view;
  const scene=params.get('scene')||'initial';
  const fixture=scene==='initial'?null:Object.fromEntries(CrownlandsEstate.buildings.map(b=>[b.key,scene==='completed'?'completed':'constructing']));
  view=CrownlandsEstate.mount(host,{cityName:'Crownlands',fixture,onBack:()=>{view.fit();}});
  const controls=document.createElement('div');controls.id='fixtureControls';controls.innerHTML='<select aria-label="Visual fixture"><option value="initial">Initial estate</option><option value="completed">All completed</option><option value="constructing">Construction</option></select>';
  host.querySelector('.estate-viewport').append(controls);controls.children[0].value=scene;
  controls.children[0].onchange=event=>{params.set('scene',event.target.value);params.delete('motion');location.search=params.toString()};
  document.querySelector('#closeModalBtn').onclick=()=>{view.destroy();dialog.close();};dialog.addEventListener('close',()=>view.destroy());dialog.showModal();
  window.estatePreview=view;
</script></body></html>
