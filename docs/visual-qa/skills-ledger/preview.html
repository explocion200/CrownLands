<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Skills preview</title><link rel="icon" href="assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="docs/visual-qa/skills-ledger/draft.css"><script src="economy-config.js"></script><script src="docs/visual-qa/skills-ledger/preview.js" defer></script></head>
<body><div class="backdrop" aria-hidden="true"></div><button id="reopen">Open Skills</button>
<dialog id="skillsDialog" aria-labelledby="skillsTitle"><div class="skills-shell">
<header class="profile-header"><div class="heading"><img src="docs/visual-qa/skills-ledger/icons/guildCharters.svg" alt=""><div><p>YOUR KINGDOM</p><h1 id="skillsTitle">Skills</h1></div></div><nav class="profile-tabs" aria-label="Kingdom sections"><button data-section="Profile">Profile</button><button data-section="Clan">Clan</button><button aria-current="page" data-section="Skills">Skills</button><button data-section="Settings">Settings</button></nav><button id="close" class="close" aria-label="Close Skills">×</button></header>
<nav id="presetTabs" class="preset-tabs" role="tablist" aria-label="Skill builds"></nav>
<section class="build-bar" aria-label="Selected skill build"><div class="build-identity"><div class="build-name-row"><strong id="buildName">Current Build</strong><span id="buildTag" class="build-tag">LIVE</span></div><span id="buildHint">Changes apply immediately</span><label class="sr-only" for="presetName">Preset name, 24 characters maximum</label><input id="presetName" maxlength="24" hidden></div><div class="points"><span><strong id="available">0</strong> <span>unspent</span></span><span><strong id="spent">0</strong> <span>spent</span></span><span class="hero-level">Hero <strong id="level">76</strong></span></div><div class="build-actions"><button id="resetSkills" class="secondary">Reset skills <small>Free · <span id="refundTotal">0</span> points returned</small></button><button id="savePreset" class="secondary" hidden>Save Preset</button><button id="applyPreset" class="primary" hidden>Apply <span id="applyPrice"></span></button></div></section>
<nav id="categoryTabs" class="category-tabs" aria-label="Skill categories"></nav>
<main id="skillGroups" class="skill-groups"></main>
</div></dialog>
<dialog id="actionDialog" aria-labelledby="actionTitle"><form method="dialog"><header><h2 id="actionTitle"></h2><button value="cancel" class="close" aria-label="Close action">×</button></header><p id="actionCopy"></p><div id="actionNumbers"></div><footer><button id="cancelAction" value="cancel" class="secondary">Cancel</button><button id="confirmAction" value="confirm" class="primary">Confirm</button></footer></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
