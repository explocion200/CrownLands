<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Full Battle Report preview</title><link rel="icon" href="assets/icons/crownlands-favicon-32.png"><link rel="stylesheet" href="docs/visual-qa/battle-report-detail/draft.css"><script src="docs/visual-qa/battle-report-detail/preview.js" defer></script></head>
