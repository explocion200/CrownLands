<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crownlands · Halloween transition draft</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto minmax(0,1fr) auto; overflow: hidden; background: #201c18; color: #f1dfb6; font: 16px Georgia, serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 2px solid #89754a; background: #33291f; }
  h1 { font-size: 18px; margin: 0 auto 0 0; }
  label { font-size: 14px; }
  select, button { font: inherit; background: #ead8b0; color: #32291e; border: 1px solid #a38a52; border-radius: 4px; padding: 6px 9px; }
  button { cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  iframe { border: 0; display: block; width: 100%; height: 100%; min-height: 0; }
  p { font-size: 13px; margin: 10px 18px; }
  @media(max-height:500px) { header { gap: 8px; padding: 6px 10px; } h1 { font-size: 14px; } select,button { padding: 4px; } }
</style>
<header>
  <h1>Crownlands · Halloween draft</h1>
  <label>Artwork <select id="theme"><option value="halloween">Halloween</option><option value="clouds">Original clouds</option></select></label>
  <label>Direction <select id="direction"><option>east</option><option>west</option><option>north</option><option>south</option></select></label>
  <label>Motion <select id="mode"><option value="full">Full</option><option value="reduced">Reduced</option><option value="off">Off</option></select></label>
  <button id="play" disabled>Play transition</button>
  <button id="hold" disabled>Hold cover</button>
</header>
<iframe id="game" title="Crownlands local fixture" src="/__benchmark__/?scenario=A&amp;visualMarches=0"></iframe>
<p id="status" role="status">Loading local preview…</p>
<script>
  const frame = document.getElementById('game'), play = document.getElementById('play'), hold = document.getElementById('hold');
  const status = document.getElementById('status');
  let transition = null;
  const ready = setInterval(() => {
    const runtime = frame.contentWindow;
    if (runtime.__CROWNLANDS_BENCHMARK__?.getStatus().status !== 'ready') return;
    runtime.__CROWNLANDS_BENCHMARK__.closeModal();
    play.disabled = hold.disabled = false;
    status.textContent = 'Flapping bats sweep through dusk mist, then scatter to reveal the next map. Local preview; production is unchanged.';
    clearInterval(ready);
  }, 100);
  function begin() {
    const runtime = frame.contentWindow, doc = runtime.document;
    runtime.CrownlandsAnimations.setMode(document.getElementById('mode').value, {persist:false});
    transition = runtime.CrownlandsAnimations.beginMapTransition({
      root:doc.getElementById('mapFrame'), stage:doc.getElementById('mapTransitionStage'),
      direction:document.getElementById('direction').value, theme:document.getElementById('theme').value,
    });
    return transition;
  }
  play.onclick = () => {
    hold.textContent = 'Hold cover';
    const current = begin();
    if (current) setTimeout(() => current.finish(), 620);
  };
  hold.onclick = () => {
    if (transition && hold.textContent === 'Reveal map') { transition.finish(); hold.textContent = 'Hold cover'; }
    else if (begin()) hold.textContent = 'Reveal map';
  };
</script>
</html>
