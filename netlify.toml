[build]
  publish = "dist"
  command = "node tools/sync-runtime-data.js --check && node tools/generate-release-manifest.js && node tools/build-production-client.js && node tools/validate-production-artifact.js"

[[redirects]]
  from = "/play/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
  force = true

[[redirects]]
  from = "/Crownlands-current-build"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Crownlands-current-build/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/Crownlands-current-build/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/firebase-hosting-redirect"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/firebase-hosting-redirect/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/worlds/world_01/maps/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/worlds/world_01/maps/versioned/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/thumbnails/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/worlds/world_01/thumbnails/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/worlds/world_01/thumbnails/versioned/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
