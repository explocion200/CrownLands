name: Crownlands release gate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: "11.9.0"
          runtime: "node@22"
          cache: true
          cache-dependency-path: functions/pnpm-lock.yaml
          package-json-file: functions/package.json
          install: false
      - name: Install locked dependencies
        working-directory: functions
        run: pnpm install --frozen-lockfile
      - name: Run static release gate
        working-directory: functions
        run: pnpm run gate:static

  emulator:
    name: Multiplayer emulator validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: "11.9.0"
          runtime: "node@22"
          cache: true
          cache-dependency-path: functions/pnpm-lock.yaml
          package-json-file: functions/package.json
          install: false
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install locked dependencies
        working-directory: functions
        run: pnpm install --frozen-lockfile
      - name: Run multiplayer emulator gate
        working-directory: functions
        run: pnpm run test:emulators

  validate:
    name: Validate
    if: ${{ always() }}
    needs: [static, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm release gates passed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$EMULATOR_RESULT" = "success"
