# PostgreSQL 18: retain precise Serializable read dependencies for kingdoms
# with hundreds of cities. Defaults promote ~32 reads to a table-wide predicate
# lock, causing unrelated game-document writes to trigger false conflicts.
# Installing this operator-reviewed file requires a PostgreSQL restart.
# Isolation, retry bounds, durability and connection limits remain unchanged.
max_pred_locks_per_transaction = 1024
max_pred_locks_per_relation = 512
max_pred_locks_per_page = 16
