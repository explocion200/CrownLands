# Private home-server dashboard. Never bind this service to a public address.
[global]
    hostname = crownlands-home
    update every = 5

[db]
    mode = dbengine
    storage tiers = 2
    dbengine tier 0 retention size = 1GiB
    dbengine tier 0 retention time = 3d
    dbengine tier 1 retention size = 256MiB
    dbengine tier 1 retention time = 30d

[web]
    bind to = 127.0.0.1:19999=dashboard 192.168.1.145:19999=dashboard 100.114.92.30:19999=dashboard
    allow connections from = localhost 127.0.0.1 192.168.1.* 100.*
    allow connections by dns = no
    allow dashboard from = localhost 127.0.0.1 192.168.1.* 100.*
    allow dashboard by dns = no
    allow netdata.conf from = localhost
    allow management from = localhost
    allow streaming from = localhost
    respect do not track policy = yes
    x-frame-options response header = SAMEORIGIN

[plugins]
    enable running new plugins = no
    proc = yes
    diskspace = yes
    cgroups = yes
    apps = yes
    go.d = yes
    crownlands = yes
    python.d = no
    charts.d = no
    ebpf = no
    perf = no
    debugfs = no
    slabinfo = no
    nfacct = no
    otel = no
    statsd = no

[plugin:crownlands]
    update every = 10

[ml]
    enabled = no

[registry]
    enabled = no

[cloud]
    enabled = no

[health]
    # Keep local visual alarms; existing Google Cloud email alerts stay in charge.
    script to execute on alarm = /bin/true
