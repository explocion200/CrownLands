# /etc/systemd/system/netdata.service.d/private.conf
[Service]
Environment=DO_NOT_TRACK=1 DISABLE_TELEMETRY=1
Nice=10
CPUQuota=50%
MemoryHigh=512M
MemoryMax=1G
# Netdata and its children may only communicate on loopback, LAN and Tailscale.
# Package downloads run separately through apt; no Cloud connection is needed.
IPAddressDeny=any
IPAddressAllow=localhost
IPAddressAllow=192.168.1.0/24
IPAddressAllow=100.64.0.0/10
