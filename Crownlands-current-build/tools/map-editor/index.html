<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crownlands World Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="editor-shell">
    <header class="editor-toolbar">
      <div class="brand-block">
        <span>Crownlands</span>
        <strong>Developer Map Editor</strong>
      </div>
      <div class="mode-tabs" role="group" aria-label="Editor mode">
        <button id="worldModeBtn" class="tool-btn active" type="button">World Layout</button>
        <button id="regionModeBtn" class="tool-btn" type="button">Region Edit</button>
      </div>
      <div class="tool-strip" role="group" aria-label="Editor tools">
        <button id="addRegionBtn" class="tool-btn" type="button">Add Region</button>
        <button id="editRegionBtn" class="tool-btn" type="button">Edit Region</button>
        <button id="addCityBtn" class="tool-btn" type="button">Add City</button>
        <button id="addStrongholdBtn" class="tool-btn" type="button">Add Stronghold</button>
        <button id="addEdgeBtn" class="tool-btn" type="button">Add Edge Connection</button>
        <button id="deleteSelectedBtn" class="tool-btn danger" type="button">Delete Selected</button>
      </div>
      <div class="tool-strip" role="group" aria-label="Data actions">
        <button id="validateBtn" class="tool-btn" type="button">Validate World</button>
        <button id="exportBtn" class="tool-btn" type="button">Export JSON</button>
        <button id="importBtn" class="tool-btn" type="button">Import JSON</button>
        <button id="saveBtn" class="tool-btn primary" type="button">Save to Game</button>
      </div>
      <div class="tool-strip toggles" role="group" aria-label="View toggles">
        <button id="toggleGridBtn" class="tool-btn active" type="button">Toggle Grid</button>
        <button id="toggleCitiesBtn" class="tool-btn active" type="button">Toggle Cities</button>
        <button id="toggleStrongholdsBtn" class="tool-btn active" type="button">Toggle Strongholds</button>
        <button id="toggleConnectionsBtn" class="tool-btn active" type="button">Toggle Connections</button>
      </div>
      <input id="importFileInput" type="file" accept=".json,application/json" hidden />
    </header>

    <section class="editor-body">
      <section class="workspace">
        <div class="workspace-title">
          <div>
            <span id="workspaceKicker">World Layout</span>
            <strong id="workspaceTitle">Loading...</strong>
          </div>
          <div class="context-tools">
            <label class="compact-field">
              <span>Stronghold</span>
              <select id="strongholdTypeSelect">
                <option value="gold_stronghold">Gold</option>
                <option value="troop_stronghold">Troops</option>
                <option value="march_speed_stronghold">Speed</option>
                <option value="defense_stronghold">Defense</option>
                <option value="upgrade_discount_stronghold">Upgrade</option>
                <option value="crown_citadel">Crown Citadel</option>
              </select>
            </label>
            <label class="compact-field">
              <span>Edge Type</span>
              <select id="edgeTypeSelect">
                <option value="road">Road</option>
                <option value="valley">Valley</option>
                <option value="pass">Pass</option>
                <option value="river_crossing">River Crossing</option>
                <option value="open_field">Open Field</option>
                <option value="forest_break">Forest Break</option>
                <option value="bridge">Bridge</option>
              </select>
            </label>
            <button id="zoomOutBtn" class="tool-btn small" type="button">-</button>
            <span id="zoomLabel" class="zoom-label">100%</span>
            <button id="zoomInBtn" class="tool-btn small" type="button">+</button>
          </div>
        </div>

        <div id="worldView" class="world-view">
          <svg id="worldConnectionLayer" class="world-connection-layer" aria-hidden="true"></svg>
          <div id="worldGrid" class="world-grid"></div>
        </div>

        <div id="regionView" class="region-view hidden">
          <div id="regionViewport" class="region-viewport">
            <div id="regionCanvas" class="region-canvas">
              <img id="regionImage" class="region-image" alt="" draggable="false" />
              <div id="edgeLayer" class="edge-layer"></div>
              <div id="markerLayer" class="marker-layer"></div>
            </div>
          </div>
        </div>
      </section>

      <aside class="inspector" aria-label="Selected object">
        <section class="panel">
          <div class="panel-heading">
            <span>World</span>
            <strong id="worldNameLabel">World</strong>
          </div>
          <label>
            <span>World ID</span>
            <input id="worldIdInput" />
          </label>
          <label>
            <span>World Name</span>
            <input id="worldNameInput" />
          </label>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <span>Selection</span>
            <strong id="selectionTitle">None</strong>
          </div>
          <div id="selectionForm" class="selection-form empty">Select a region, city, stronghold, or edge connection.</div>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <span>Validation</span>
            <strong id="validationSummary">Not checked</strong>
          </div>
          <div id="validationList" class="validation-list">Press Validate World when you want a full check.</div>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <span>Counts</span>
            <strong id="countSummary">0 regions</strong>
          </div>
          <div class="stats-grid">
            <div><span>Regions</span><strong id="regionCountStat">0</strong></div>
            <div><span>Cities</span><strong id="cityCountStat">0</strong></div>
            <div><span>Strongholds</span><strong id="strongholdCountStat">0</strong></div>
            <div><span>Edges</span><strong id="edgeCountStat">0</strong></div>
          </div>
        </section>
      </aside>
    </section>

    <footer id="statusBar" class="status-bar">Loading world data...</footer>
  </main>
  <script src="editor.js"></script>
</body>
</html>
